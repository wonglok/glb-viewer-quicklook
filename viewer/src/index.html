<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GLB preview</title>
    <!--
      The page and its two classic scripts come from the appex bundle over
      file://; the model and the decoders are fetched from glbview://, which is
      a different origin — hence the explicit glbview: in connect-src/img-src.

      blob: is needed because DRACOLoader and KTX2Loader both build their Web
      Workers from blob URLs; unsafe-eval / wasm-unsafe-eval because the decoders
      inlined into those workers compile WebAssembly and use new Function.
      No 'unsafe-inline': the two URLs the page needs arrive as a user script,
      which WebKit injects outside CSP.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:;
               worker-src blob:;
               child-src blob:;
               style-src 'self' 'unsafe-inline';
               img-src 'self' glbview: blob: data:;
               connect-src 'self' glbview: blob: data:;
               font-src 'self';"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #viewer {
        position: absolute;
        inset: 0;
      }
      #viewer canvas {
        display: block;
      }
      #status {
        position: absolute;
        inset: auto 16px 14px 16px;
        text-align: center;
        font: 12px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        color: rgba(140, 140, 140, 0.95);
        pointer-events: none;
      }

      /*
        The loading screen. It is deliberately transparent rather than painted:
        the Quick Look panel draws its own material underneath, and a page
        background would cover it. The spinner is a CSS animation, so it keeps
        turning even if the host suspends requestAnimationFrame — which Quick
        Look does — without depending on any of the viewer's own JS.
      */
      #loading {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        color: rgba(125, 125, 130, 0.95);
        pointer-events: none;
        opacity: 1;
        transition: opacity 200ms ease-out;
      }
      #loading.is-done {
        opacity: 0;
        visibility: hidden;
      }
      .spinner {
        width: 26px;
        height: 26px;
        box-sizing: border-box;
        border: 2.5px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        opacity: 0.75;
        animation: spin 900ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .track {
        width: 132px;
        height: 3px;
        border-radius: 2px;
        background: rgba(128, 128, 128, 0.25);
        overflow: hidden;
        /* Hidden until a Content-Length says how far along we are; without one
           the spinner alone carries the state rather than a bar that lies. */
        display: none;
      }
      .track.is-active {
        display: block;
      }
      .bar {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: currentColor;
        transition: width 120ms linear;
      }
      #loading.is-error {
        color: rgba(190, 90, 70, 0.95);
        max-width: 80%;
        text-align: center;
      }
      #loading.is-error .spinner,
      #loading.is-error .track,
      #loading.is-error #precompile {
        display: none;
      }

      /*
        Shader compilation is a second phase: the bytes have arrived, but the
        first frame cannot draw until every program the model needs is built.
        It gets its own quieter row below the load progress, so the load bar
        reaching 100% does not look like a stall and the two phases stay
        distinguishable. Hidden until compilation actually starts.
      */
      #precompile {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      #precompile.is-active {
        display: flex;
      }
      #precompile-label {
        font-size: 11.5px;
        opacity: 0.85;
      }
      #precompile .track {
        width: 132px;
        height: 2px;
      }

      @media (prefers-color-scheme: dark) {
        #status {
          color: rgba(170, 170, 175, 0.95);
        }
        #loading {
          color: rgba(195, 195, 200, 0.95);
        }
        .track {
          background: rgba(200, 200, 200, 0.28);
        }
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <div id="loading">
      <div class="spinner"></div>
      <div id="loading-label">Loading…</div>
      <div class="track" id="loading-track"><div class="bar" id="loading-bar"></div></div>
      <div id="precompile">
        <div id="precompile-label">Precompiling shaders…</div>
        <div class="track" id="precompile-track"><div class="bar" id="precompile-bar"></div></div>
      </div>
    </div>
    <div id="status"></div>
    <script src="./boot.js"></script>
    <script src="./viewer.js"></script>
  </body>
</html>
